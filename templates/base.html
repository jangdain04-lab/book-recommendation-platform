<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Book Recommendation Platform{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'binder:list_book' %}">Book Platform</a>
      <div class="d-flex gap-3 small">
        <a class="text-decoration-none" href="{% url 'binder:list_book' %}">Books</a>
        <a class="text-decoration-none" href="{% url 'binder:recommendation-list-create' %}">Recommendations</a>
        <a class="text-decoration-none" href="{% url 'binder:add_review' %}">Write Review</a>
        <a class="text-decoration-none" href="{% url 'binder:mypage_view' %}">My Page</a>
        <a class="text-decoration-none" href="{% url 'binder:gpt_chatbot' %}">Chatbot</a>
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
