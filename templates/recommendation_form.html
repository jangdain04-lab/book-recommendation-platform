{% extends 'base.html' %}
{% block title %}New Recommendation{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 mb-4">책 추천 받기</h1>
    <form id="rec-form">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="bookSelect">기준 도서</label>
        <select id="bookSelect" class="form-select" required>
          {% for book in books %}
            <option value="{{ book.id }}">{{ book.title }}</option>
          {% empty %}
            <option value="">먼저 리뷰를 작성한 도서가 필요합니다.</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-4">
        <h2 class="h6">유사 도서</h2>
        <div id="similar-list" class="row g-3"></div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{% url 'binder:recommendation-list-create' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
$(function(){
  const listUrl = "{% url 'binder:recommendation-list-create' %}";
  const similarUrl = "{% url 'binder:recommendation-similar' %}";

  function loadSimilar(bookId){
    if (!bookId) return;
    $.getJSON(similarUrl, { book_id: bookId }, data => {
      const container = $('#similar-list').empty();
      data.forEach(book => {
        container.append(`<div class="col-6 col-md-3 text-center">
          ${book.cover_image ? `<img src="${book.cover_image}" alt="${book.title}" class="img-fluid rounded mb-2" style="max-height:150px">` : ''}
          <div class="small fw-semibold">${book.title}</div>
        </div>`);
      });
      if (!data.length) container.append('<p class="text-secondary">유사 도서를 찾지 못했습니다.</p>');
    });
  }

  loadSimilar($('#bookSelect').val());
  $('#bookSelect').on('change', function(){ loadSimilar($(this).val()); });

  $('#rec-form').on('submit', function(e){
    e.preventDefault();
    const bookId = $('#bookSelect').val();
    if (!bookId) return;
    $.ajax({
      url: listUrl,
      method: 'POST',
      data: JSON.stringify({ book_id: Number(bookId) }),
      contentType: 'application/json',
      headers: { 'X-CSRFToken': $('[name=csrfmiddlewaretoken]').val() },
      success: () => window.location.href = listUrl
    });
  });
});
</script>
{% endblock %}
