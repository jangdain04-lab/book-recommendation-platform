{% extends 'base.html' %}
{% block title %}{% if book %}Edit Book{% else %}Add Book{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">{% if book %}Edit Book{% else %}Add Book{% endif %}</h1>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">ISBN or keyword</label>
            <div class="input-group">
              <input class="form-control" type="text" name="isbn" id="isbn-input" value="{{ book.isbn|default:'' }}">
              <button class="btn btn-outline-secondary" type="button" onclick="fetchBookData()">Fetch</button>
            </div>
          </div>
          <div class="mb-3"><label class="form-label">Title</label><input class="form-control" name="title" id="title" value="{{ book.title|default:'' }}" required></div>
          <div class="mb-3"><label class="form-label">Author</label><input class="form-control" name="author" id="author" value="{{ book.author|default:'' }}"></div>
          <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" rows="4" name="description" id="description">{{ book.description|default:'' }}</textarea></div>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Genre</label><input class="form-control" name="genre" id="genre" value="{{ book.genre|default:'' }}"></div>
            <div class="col-md-6"><label class="form-label">Rating</label><input class="form-control" type="number" name="rating" step="0.1" max="5" min="0" value="{{ book.rating|default:'0' }}"></div>
          </div>
          <div class="mb-3 mt-3"><label class="form-label">Price</label><input class="form-control" name="price" id="price" value="{{ book.price|default:'' }}"></div>
          <div class="mb-3"><label class="form-label">Cover Image URL</label><input class="form-control" name="cover_image" id="cover_image" value="{{ book.cover_image|default:'' }}"></div>
          <div class="mb-4"><label class="form-label">Tags</label><input class="form-control" name="tags" value="{% for tag in book.tags.all %}{{ tag.tag }}{% if not forloop.last %}, {% endif %}{% endfor %}" placeholder="data, UX, fiction"></div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" href="{% url 'binder:list_book' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
function fetchBookData() {
  const query = document.getElementById('isbn-input').value.trim();
  if (!query) return;
  fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}`)
    .then(res => res.json())
    .then(data => {
      if (!data.items?.length) {
        alert('검색 결과가 없습니다.');
        return;
      }
      const info = data.items[0].volumeInfo || {};
      document.getElementById('title').value = info.title || '';
      document.getElementById('author').value = (info.authors || []).slice(0, 3).join(', ');
      document.getElementById('description').value = info.description || '';
      document.getElementById('cover_image').value = info.imageLinks?.thumbnail || '';
      document.getElementById('genre').value = (info.categories || []).join(', ');
    })
    .catch(() => alert('도서 정보를 불러오지 못했습니다.'));
}
</script>
{% endblock %}
